# Logger level: debug, info, warn, error
log_level = "info"

# Work directory to hold the repos and states.
# NOTE: Must end with a slash (/).
data_dir = "./data/"

[webhook]
# Webhook URL
url = "http://127.0.0.1:2018/webhook"
# Request method
method = "POST"
# Bearer token to authenticate
token = "???"
# Name to identify this tool
from = "git-monitor"
# Target to announce the messages
target = "#dragonflybsd"

[urlshort]
# Base URL of the URL shortener API, including the version prefix.
# Optional: when omitted, the full commit URL is announced.
api = "https://example.com/.api/v1"
# Bearer token to authenticate with the URL shortener API
token = "???"
# Total HTTP request timeout in seconds
timeout = 5

[[repos]]
enabled = true
name = "dragonfly"
url = "git://git.dragonflybsd.org/dragonfly.git"
# text/template for the web URL of a commit; {{ .Hash }} is the full hash.
commit_url = "https://gitweb.dragonflybsd.org/dragonfly.git/commit/{{ .Hash }}"
interval = 60  # seconds
